name: Validate Skills and catalog

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate catalog
        run: python scripts/bioinstall.py validate
      - name: Validate Agent Skills
        run: python scripts/validate_skills.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Build installable terminal commands
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Smoke test wheel outside checkout
        run: |
          python -m venv "$RUNNER_TEMP/bioagent-smoke"
          "$RUNNER_TEMP/bioagent-smoke/bin/python" -m pip install --no-index --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/bioagent-smoke/bin/bioinstall" validate
          "$RUNNER_TEMP/bioagent-smoke/bin/bioagent" --help
