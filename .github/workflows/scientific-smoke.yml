name: Scientific software installation smoke tests

on:
  push:
    branches: [main]
    paths:
      - catalog/pdbfixer.json
      - catalog/autodock-vina.json
      - catalog/freesasa.json
      - catalog/propka.json
      - catalog/openbabel.json
      - catalog/meeko.json
      - catalog/mdtraj.json
      - catalog/parmed.json
      - catalog/gemmi.json
      - catalog/prolif.json
      - catalog/openmmforcefields.json
      - catalog/pdb2pqr.json
      - catalog/apbs.json
      - scripts/bioinstall.py
      - tests/check_installed_handoff.py
      - .github/workflows/scientific-smoke.yml
  pull_request:
    paths:
      - catalog/pdbfixer.json
      - catalog/autodock-vina.json
      - catalog/freesasa.json
      - catalog/propka.json
      - catalog/openbabel.json
      - catalog/meeko.json
      - catalog/mdtraj.json
      - catalog/parmed.json
      - catalog/gemmi.json
      - catalog/prolif.json
      - catalog/openmmforcefields.json
      - catalog/pdb2pqr.json
      - catalog/apbs.json
      - scripts/bioinstall.py
      - tests/check_installed_handoff.py
      - .github/workflows/scientific-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    name: ${{ matrix.tool }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {tool: pdbfixer, os: ubuntu-latest}
          - {tool: pdbfixer, os: windows-latest}
          - {tool: pdbfixer, os: macos-latest}
          - {tool: autodock-vina, os: ubuntu-latest}
          - {tool: autodock-vina, os: macos-latest}
          - {tool: freesasa, os: ubuntu-latest}
          - {tool: freesasa, os: macos-latest}
          - {tool: propka, os: ubuntu-latest}
          - {tool: propka, os: windows-latest}
          - {tool: propka, os: macos-latest}
          - {tool: openbabel, os: ubuntu-latest}
          - {tool: openbabel, os: windows-latest}
          - {tool: openbabel, os: macos-latest}
          - {tool: meeko, os: ubuntu-latest}
          - {tool: meeko, os: windows-latest}
          - {tool: meeko, os: macos-latest}
          - {tool: mdtraj, os: ubuntu-latest}
          - {tool: mdtraj, os: windows-latest}
          - {tool: mdtraj, os: macos-latest}
          - {tool: parmed, os: ubuntu-latest}
          - {tool: parmed, os: windows-latest}
          - {tool: parmed, os: macos-latest}
          - {tool: gemmi, os: ubuntu-latest}
          - {tool: gemmi, os: windows-latest}
          - {tool: gemmi, os: macos-latest}
          - {tool: prolif, os: ubuntu-latest}
          - {tool: prolif, os: windows-latest}
          - {tool: prolif, os: macos-latest}
          - {tool: openmmforcefields, os: ubuntu-latest}
          - {tool: openmmforcefields, os: macos-latest}
          - {tool: pdb2pqr, os: ubuntu-latest}
          - {tool: pdb2pqr, os: windows-latest}
          - {tool: pdb2pqr, os: macos-latest}
          - {tool: apbs, os: ubuntu-latest}
          - {tool: apbs, os: windows-latest}
          - {tool: apbs, os: macos-latest}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: ""
          auto-activate: false
      - name: Inspect local prerequisites
        run: python scripts/bioinstall.py doctor
      - name: Install reviewed recipe in a disposable runner
        run: python scripts/bioinstall.py install ${{ matrix.tool }} --apply
      - name: Repeat the basic verification
        run: python scripts/bioinstall.py verify ${{ matrix.tool }}
      - name: Check installed environment, receipt and invocation handoff
        run: python tests/check_installed_handoff.py ${{ matrix.tool }}
      - name: Preserve verified installation receipt
        uses: actions/upload-artifact@v4
        with:
          name: receipt-${{ matrix.tool }}-${{ matrix.os }}
          path: ~/.bioagent-skills/receipts/*.json
          if-no-files-found: error
          retention-days: 14
